<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="main" id="main">
        <div class="sidebar">
            <div class="sidebar__icon" id="hide"></div>
            <div class="sidebar__icon"></div>
        </div>
        <div class="navbar">
            <div class="navbar__controlpanel">
                <div>Сортировка</div>
                <input class="navbar__controlpanel-input" type="text" placeholder="Поиск заметок">
                <button class="create-btn" id="create-btn">+</button>
            </div>
            <div class="navbar__content" id="navbar__content">
                <div class="navbar__content-note active-note">
                    <div class="navbar__content-note-date">
                        <div class="num">18</div>
                        <div class="word">пон</div>
                    </div>
                    <div class="navbar__content-note-textpiece">
                        <b>Lorem ipsum</b>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    </div>
                </div>
                <div class="navbar__content-note">
                    <div class="navbar__content-note-date">
                        <div class="num">18</div>
                        <div class="word">пон</div>
                        <div class="fullDate" id="full-date">пон</div>
                    </div>
                    <div class="navbar__content-note-textpiece">
                        <b class="navbar__content-note-textpiece-title">Lorem ipsum</b>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    </div>
                </div>
                
            </div>
        </div>
        <div class="editor">
            <div class="editor__top">
                <div class="editor__top-switch">
                    <button><</button>
                    <button>></button>
                </div>
                <button class="trash-can"></button>
            </div>
            <div class="editor__tools"></div>
            <div class="editor__content" id="editor__content">
                <div class="editor_content-date">Понедельник, 18 Июня 2026</div>
                <textarea class="editor_content-title" placeholder="Название" name="editable-title" id="123"></textarea>
                <textarea class="editor_content-text" placeholder="Напишите что-нибудь..." name="editable" id="1234"></textarea>
            </div>
        </div>
    </div>
    <div class="shadow" id="shadow">
        <form class="form-create">
            <input class="form-create__title" id="form-create__title" type="text" placeholder="Название заметки">
            <textarea class="form-create__desc" id="form-create__desc" placeholder="Напишите что-нибудь" rows="15"></textarea>
            <button class="form-create__btn" id="save-btn">Сохранить</button>
            <button class="form-create__close__btn" id="close-btn">x</button>
        </form>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
